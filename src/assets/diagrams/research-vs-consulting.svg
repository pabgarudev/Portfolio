<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" id="dg-research-vs-consulting" role="img" aria-labelledby="dg-research-vs-consulting-t dg-research-vs-consulting-d">
<title id="dg-research-vs-consulting-t">What research optimises for versus what consulting optimises for</title>
<desc id="dg-research-vs-consulting-d">Two columns side by side. Research optimises for being thorough on your own timeline: months on one idea, rewriting the same experiment repeatedly, nobody blocked but yourself, and a bar of whether the result is true and new. Consulting optimises for being useful on someone else's timeline: a team, a client, a scope and a schedule, integrating cleanly and shipping on time, with people waiting on you, and a bar of whether it works for them. An arrow between the columns marks the adjustment from one to the other, labelled as a different set of muscles rather than an upgrade in either direction.</desc>
<style>#dg-research-vs-consulting{--dg-ink:#0a0a0a;--dg-muted:rgba(10,10,10,0.62);--dg-faint:rgba(10,10,10,0.48);--dg-hairline:rgba(10,10,10,0.14);--dg-grid:rgba(10,10,10,0.07);--dg-surface:rgba(10,10,10,0.04);--dg-surface-strong:rgba(10,10,10,0.08);--dg-paper:#ffffff;--dg-accent:#5b5aa8;--dg-accent-soft:rgba(120,119,198,0.16);--dg-accent2:#00734d;--dg-accent2-soft:rgba(0,224,143,0.16);--dg-warn:#a54a08;--dg-warn-soft:rgba(180,83,9,0.14);max-width:100%;height:auto;display:block}[data-theme="dark"] #dg-research-vs-consulting{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #dg-research-vs-consulting{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}}#dg-research-vs-consulting text{font-variant-numeric:tabular-nums;white-space:pre}</style>
<text x="24" y="40" fill="var(--dg-ink)" font-size="17" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" font-weight="600">Depth, or someone else&#x27;s schedule</text><text x="24" y="62" fill="var(--dg-muted)" font-size="13" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">Eight months of learning which muscles the other one uses</text>
<rect x="24" y="82" width="319" height="284" rx="10" fill="var(--dg-surface)" stroke="var(--dg-hairline)" stroke-width="1" vector-effect="non-scaling-stroke" />
<text x="44" y="122" fill="var(--dg-accent)" font-size="15" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" font-weight="600">Research</text><text x="44" y="142" fill="var(--dg-muted)" font-size="11" font-family="'JetBrains Mono Variable', ui-monospace, monospace">thorough, on my own timeline</text><line x1="44" y1="156" x2="323" y2="156" stroke="var(--dg-hairline)" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke" />
<circle cx="48" cy="180" r="3" fill="var(--dg-accent)" /><text x="60" y="184" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">months on one idea</text>
<circle cx="48" cy="222" r="3" fill="var(--dg-accent)" /><text x="60" y="226" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">rewrite the same experiment five times</text>
<circle cx="48" cy="264" r="3" fill="var(--dg-accent)" /><text x="60" y="268" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">nobody blocked but yourself</text>
<circle cx="48" cy="306" r="3" fill="var(--dg-accent)" /><text x="60" y="310" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">the bar is: is it true and is it new</text>
<rect x="397" y="82" width="319" height="284" rx="10" fill="var(--dg-surface)" stroke="var(--dg-hairline)" stroke-width="1" vector-effect="non-scaling-stroke" />
<text x="417" y="122" fill="var(--dg-accent2)" font-size="15" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" font-weight="600">Consulting</text><text x="417" y="142" fill="var(--dg-muted)" font-size="11" font-family="'JetBrains Mono Variable', ui-monospace, monospace">useful, on someone else&#x27;s</text><line x1="417" y1="156" x2="696" y2="156" stroke="var(--dg-hairline)" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke" />
<circle cx="421" cy="180" r="3" fill="var(--dg-accent2)" /><text x="433" y="184" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">a team, a client, a scope, a schedule</text>
<circle cx="421" cy="222" r="3" fill="var(--dg-accent2)" /><text x="433" y="226" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">integrate cleanly, ship on time</text>
<circle cx="421" cy="264" r="3" fill="var(--dg-accent2)" /><text x="433" y="268" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">people are waiting on you</text>
<circle cx="421" cy="306" r="3" fill="var(--dg-accent2)" /><text x="433" y="310" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">the bar is: does it work for them</text>
<g transform="translate(370,168) rotate(-90)"><text x="0" y="0" fill="var(--dg-muted)" font-size="11" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="middle">the adjustment</text></g><line x1="351" y1="258" x2="381.35" y2="258" stroke="var(--dg-ink)" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke" /><polygon points="389,258 380,255.03 380,260.97" fill="var(--dg-ink)" stroke="none" stroke-width="0" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
<text x="24" y="392" fill="var(--dg-faint)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">“Not worse, just a different set of muscles than the ones four years of a thesis had built up.”</text>
</svg>