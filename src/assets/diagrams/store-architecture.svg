<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" id="dg-store-architecture" role="img" aria-labelledby="dg-store-architecture-t dg-store-architecture-d">
<title id="dg-store-architecture-t">The headless split behind BoundingBox.store, and which half is live</title>
<desc id="dg-store-architecture-d">An architecture diagram in two bands. The top band, drawn solid and marked live, runs from a visitor to a Next.js storefront deployed on Vercel, to the pre-launch landing page and its waitlist. The bottom band, drawn dashed and marked in development, runs from the same storefront to Shopify, which will hold the product catalogue, the cart and checkout, and payments. Headless means the storefront owns the entire presentation while Shopify owns commerce, so the two can be built and shipped separately -- which is why a landing page can be live before any product exists.</desc>
<style>#dg-store-architecture{--dg-ink:#0a0a0a;--dg-muted:rgba(10,10,10,0.62);--dg-faint:rgba(10,10,10,0.48);--dg-hairline:rgba(10,10,10,0.14);--dg-grid:rgba(10,10,10,0.07);--dg-surface:rgba(10,10,10,0.04);--dg-surface-strong:rgba(10,10,10,0.08);--dg-paper:#ffffff;--dg-accent:#5b5aa8;--dg-accent-soft:rgba(120,119,198,0.16);--dg-accent2:#00734d;--dg-accent2-soft:rgba(0,224,143,0.16);--dg-warn:#a54a08;--dg-warn-soft:rgba(180,83,9,0.14);max-width:100%;height:auto;display:block}[data-theme="dark"] #dg-store-architecture{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #dg-store-architecture{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}}#dg-store-architecture text{font-variant-numeric:tabular-nums;white-space:pre}</style>
<text x="24" y="40" fill="var(--dg-ink)" font-size="17" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" font-weight="600">Headless, and honest about what exists</text><text x="24" y="62" fill="var(--dg-muted)" font-size="13" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">A storefront that owns the pixels, a backend that owns commerce</text>
<rect x="46.8" y="197" width="78.4" height="34" rx="10" fill="var(--dg-accent-soft)" stroke="var(--dg-accent)" stroke-width="1.6" vector-effect="non-scaling-stroke" /><text x="86" y="218.38" fill="var(--dg-ink)" font-size="12" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="middle">visitor</text><rect x="184.92" y="194.5" width="176.4" height="39" rx="10" fill="var(--dg-accent-soft)" stroke="var(--dg-accent)" stroke-width="2" vector-effect="non-scaling-stroke" /><text x="273.12" y="218.74" fill="var(--dg-ink)" font-size="13" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="middle">Next.js storefront</text><line x1="131.2" y1="214" x2="171.27" y2="214" stroke="var(--dg-accent)" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke" /><polygon points="178.92,214 169.92,211.03 169.92,216.97" fill="var(--dg-accent)" stroke="none" stroke-width="0" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
<text x="273.12" y="248.5" fill="var(--dg-muted)" font-size="10" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="middle">deployed on Vercel</text>
<rect x="465.04" y="109.67" width="114.4" height="34" rx="10" fill="var(--dg-accent-soft)" stroke="var(--dg-accent)" stroke-width="1.6" vector-effect="non-scaling-stroke" /><text x="522.24" y="131.05" fill="var(--dg-ink)" font-size="12" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="middle">landing page</text><rect x="611.2" y="109.67" width="85.6" height="34" rx="10" fill="var(--dg-accent-soft)" stroke="var(--dg-accent)" stroke-width="1.6" vector-effect="non-scaling-stroke" /><text x="654" y="131.05" fill="var(--dg-ink)" font-size="12" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="middle">waitlist</text><line x1="334.41" y1="192.52" x2="460.87" y2="148.18" stroke="var(--dg-accent)" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke" /><polygon points="468.09,145.65 458.61,145.83 460.57,151.43" fill="var(--dg-accent)" stroke="none" stroke-width="0" stroke-linejoin="round" vector-effect="non-scaling-stroke" /><line x1="585.44" y1="126.67" x2="597.55" y2="126.67" stroke="var(--dg-accent)" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke" /><polygon points="605.2,126.67 596.2,123.7 596.2,129.64" fill="var(--dg-accent)" stroke="none" stroke-width="0" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
<text x="716" y="94" fill="var(--dg-accent2)" font-size="10" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="end" font-weight="600">LIVE</text>
<rect x="483.04" y="284.33" width="78.4" height="34" rx="10" fill="var(--dg-surface)" stroke="var(--dg-faint)" stroke-width="1.2" vector-effect="non-scaling-stroke" /><text x="522.24" y="305.71" fill="var(--dg-muted)" font-size="12" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="middle">Shopify</text><line x1="341.63" y1="238.02" x2="470.16" y2="283.08" stroke="var(--dg-faint)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round" vector-effect="non-scaling-stroke" /><polygon points="477.38,285.61 469.87,279.83 467.9,285.43" fill="var(--dg-faint)" stroke="none" stroke-width="0" stroke-linejoin="round" vector-effect="non-scaling-stroke" /><polygon points="334.41,235.48 341.92,241.27 343.88,235.66" fill="var(--dg-faint)" stroke="none" stroke-width="0" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
<text x="716" y="340" fill="var(--dg-faint)" font-size="10" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="end" font-weight="600">IN DEVELOPMENT</text>
<text x="579.44" y="293.33" fill="var(--dg-muted)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">catalogue, cart and</text><text x="579.44" y="309.28" fill="var(--dg-muted)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">checkout, payments</text>
<rect x="24" y="358.25" width="9" height="9" rx="2" fill="var(--dg-accent)" stroke="none" stroke-width="1.5" vector-effect="non-scaling-stroke" /><text x="40" y="366.64" fill="var(--dg-muted)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">built and live today</text><rect x="158.98" y="358.25" width="9" height="9" rx="2" fill="var(--dg-faint)" stroke="none" stroke-width="1.5" vector-effect="non-scaling-stroke" /><text x="174.98" y="366.64" fill="var(--dg-muted)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">planned, still in development</text>
</svg>