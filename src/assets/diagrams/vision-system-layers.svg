<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" id="dg-vision-system-layers" role="img" aria-labelledby="dg-vision-system-layers-t dg-vision-system-layers-d">
<title id="dg-vision-system-layers-t">Where vision engineering work sits in the stack</title>
<desc id="dg-vision-system-layers-d">A four-layer stack, drawn bottom to top. Industrial cameras from vendors such as Keyence, IDS and Hikrobot sit at the base as real hardware rather than a one-off research rig. Above them, an integration layer presents one interface over cameras that each have their own. Above that, vision checking systems perform automated inspection that catches what a manual check would miss. At the top is the product that ships to a client, which has to keep working quietly for years. A note beside the stack contrasts research code, which has to convince a reviewer and reproduce a result, with this work, where the question is whether it can be trusted every single time. No specific system is shown, because that part is confidential.</desc>
<style>#dg-vision-system-layers{--dg-ink:#0a0a0a;--dg-muted:rgba(10,10,10,0.62);--dg-faint:rgba(10,10,10,0.48);--dg-hairline:rgba(10,10,10,0.14);--dg-grid:rgba(10,10,10,0.07);--dg-surface:rgba(10,10,10,0.04);--dg-surface-strong:rgba(10,10,10,0.08);--dg-paper:#ffffff;--dg-accent:#5b5aa8;--dg-accent-soft:rgba(120,119,198,0.16);--dg-accent2:#00734d;--dg-accent2-soft:rgba(0,224,143,0.16);--dg-warn:#a54a08;--dg-warn-soft:rgba(180,83,9,0.14);max-width:100%;height:auto;display:block}[data-theme="dark"] #dg-vision-system-layers{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #dg-vision-system-layers{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}}#dg-vision-system-layers text{font-variant-numeric:tabular-nums;white-space:pre}</style>
<text x="24" y="40" fill="var(--dg-ink)" font-size="17" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" font-weight="600">The shape of the work, not the systems</text><text x="24" y="62" fill="var(--dg-muted)" font-size="13" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">Defence work is confidential; the stack it sits in isn&#x27;t</text>
<rect x="24" y="82" width="410.4" height="65" rx="10" fill="var(--dg-accent-soft)" stroke="var(--dg-accent)" stroke-width="1.8" vector-effect="non-scaling-stroke" /><text x="40" y="104" fill="var(--dg-ink)" font-size="13" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" font-weight="600">Product</text><text x="40" y="122" fill="var(--dg-muted)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">what actually ships, and has to keep working for years</text>
<line x1="52" y1="161" x2="52" y2="150.95" stroke="var(--dg-hairline)" stroke-width="1.3" stroke-linecap="round" vector-effect="non-scaling-stroke" /><polygon points="52,145 49.69,152 54.31,152" fill="var(--dg-hairline)" stroke="none" stroke-width="0" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
<rect x="24" y="159" width="410.4" height="65" rx="10" fill="var(--dg-surface)" stroke="var(--dg-hairline)" stroke-width="1.2" vector-effect="non-scaling-stroke" /><text x="40" y="181" fill="var(--dg-ink)" font-size="13" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" font-weight="600">Vision checking systems</text><text x="40" y="199" fill="var(--dg-muted)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">automated inspection that catches what a manual check misses</text>
<line x1="52" y1="238" x2="52" y2="227.95" stroke="var(--dg-hairline)" stroke-width="1.3" stroke-linecap="round" vector-effect="non-scaling-stroke" /><polygon points="52,222 49.69,229 54.31,229" fill="var(--dg-hairline)" stroke="none" stroke-width="0" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
<rect x="24" y="236" width="410.4" height="65" rx="10" fill="var(--dg-surface)" stroke="var(--dg-hairline)" stroke-width="1.2" vector-effect="non-scaling-stroke" /><text x="40" y="258" fill="var(--dg-ink)" font-size="13" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" font-weight="600">Integration layer</text><text x="40" y="276" fill="var(--dg-muted)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">one interface over cameras that each have their own</text>
<line x1="52" y1="315" x2="52" y2="304.95" stroke="var(--dg-hairline)" stroke-width="1.3" stroke-linecap="round" vector-effect="non-scaling-stroke" /><polygon points="52,299 49.69,306 54.31,306" fill="var(--dg-hairline)" stroke="none" stroke-width="0" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
<rect x="24" y="313" width="410.4" height="65" rx="10" fill="var(--dg-surface)" stroke="var(--dg-hairline)" stroke-width="1.2" vector-effect="non-scaling-stroke" /><text x="40" y="335" fill="var(--dg-ink)" font-size="13" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" font-weight="600">Industrial cameras</text><text x="40" y="353" fill="var(--dg-muted)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">Keyence, IDS, Hikrobot, among others</text>
<rect x="462.4" y="82" width="273.6" height="296" rx="10" fill="var(--dg-surface)" stroke="var(--dg-hairline)" stroke-width="1" vector-effect="non-scaling-stroke" /><text x="474.4" y="100.02" fill="var(--dg-faint)" font-size="11" font-family="'JetBrains Mono Variable', ui-monospace, monospace">what changes</text>
<text x="478.4" y="134" fill="var(--dg-muted)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">Research code has to convince a reviewer</text><text x="478.4" y="151.4" fill="var(--dg-muted)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">and reproduce a result.</text>
<text x="478.4" y="204" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">This has to run reliably where “it mostly</text><text x="478.4" y="221.4" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">works” isn&#x27;t a sentence anyone wants to</text><text x="478.4" y="238.8" fill="var(--dg-ink)" font-size="12" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">hear.</text>
<line x1="478.4" y1="174" x2="720" y2="174" stroke="var(--dg-hairline)" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke" />
<text x="478.4" y="298" fill="var(--dg-accent)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">The maths doesn&#x27;t change because the stakes</text><text x="478.4" y="313.95" fill="var(--dg-accent)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">did. The environment does.</text>
<text x="24" y="402" fill="var(--dg-faint)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">Layers, not systems: the specifics of any one build aren&#x27;t mine to publish.</text>
</svg>