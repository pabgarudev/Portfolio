<circle cx="477.5" cy="246.26" r="4" fill="var(--dg-paper)" /><circle cx="477.5" cy="246.26" r="4" fill="none" stroke="var(--dg-ink)" stroke-width="1.4" vector-effect="non-scaling-stroke" />
