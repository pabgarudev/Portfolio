<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" id="dg-positioning-accuracy" role="img" aria-labelledby="dg-positioning-accuracy-t dg-positioning-accuracy-d">
<title id="dg-positioning-accuracy-t">The 2025 method beats the 2024 one on the 2024 paper's own dataset</title>
<desc id="dg-positioning-accuracy-d">A bar chart of positioning error on the same dense, overlapping-view floor dataset. The 2024 method reported 14.82 and 15.72 centimetres, averaging 15.3. The 2025 method's refinements, applied to that same data, reported 5.22 and 4.88 centimetres, averaging 5.1 -- about three times better. Because the 2025 method also handles networks with no camera overlap at all, which the 2024 method could not address, this makes it a strict generalisation rather than a specialised alternative.</desc>
<style>#dg-positioning-accuracy{--dg-ink:#0a0a0a;--dg-muted:rgba(10,10,10,0.62);--dg-faint:rgba(10,10,10,0.48);--dg-hairline:rgba(10,10,10,0.14);--dg-grid:rgba(10,10,10,0.07);--dg-surface:rgba(10,10,10,0.04);--dg-surface-strong:rgba(10,10,10,0.08);--dg-paper:#ffffff;--dg-accent:#5b5aa8;--dg-accent-soft:rgba(120,119,198,0.16);--dg-accent2:#00734d;--dg-accent2-soft:rgba(0,224,143,0.16);--dg-warn:#a54a08;--dg-warn-soft:rgba(180,83,9,0.14);max-width:100%;height:auto;display:block}[data-theme="dark"] #dg-positioning-accuracy{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #dg-positioning-accuracy{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}}#dg-positioning-accuracy text{font-variant-numeric:tabular-nums;white-space:pre}</style>
<text x="24" y="40" fill="var(--dg-ink)" font-size="17" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" font-weight="600">Same dataset, three times more accurate</text><text x="24" y="62" fill="var(--dg-muted)" font-size="13" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif">Positioning error on the 2024 paper&#x27;s own overlapping-view floor</text><line x1="82" y1="306" x2="624" y2="306" stroke="var(--dg-grid)" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke" /><text x="74" y="309.65" fill="var(--dg-muted)" font-size="10" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="end">0</text><line x1="82" y1="248.78" x2="624" y2="248.78" stroke="var(--dg-grid)" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke" /><text x="74" y="252.43" fill="var(--dg-muted)" font-size="10" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="end">5</text><line x1="82" y1="191.56" x2="624" y2="191.56" stroke="var(--dg-grid)" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke" /><text x="74" y="195.21" fill="var(--dg-muted)" font-size="10" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="end">10</text><line x1="82" y1="134.33" x2="624" y2="134.33" stroke="var(--dg-grid)" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke" /><text x="74" y="137.98" fill="var(--dg-muted)" font-size="10" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="end">15</text><line x1="217.5" y1="100" x2="217.5" y2="306" stroke="var(--dg-grid)" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke" /><text x="217.5" y="324" fill="var(--dg-muted)" font-size="10" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="middle">2024 method</text><line x1="488.5" y1="100" x2="488.5" y2="306" stroke="var(--dg-grid)" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke" /><text x="488.5" y="324" fill="var(--dg-muted)" font-size="10" font-family="'JetBrains Mono Variable', ui-monospace, monospace" text-anchor="middle">2025 refinements</text><line x1="82" y1="306" x2="624" y2="306" stroke="var(--dg-hairline)" stroke-width="1.2" stroke-linecap="round" vector-effect="non-scaling-stroke" /><line x1="82" y1="100" x2="82" y2="306" stroke="var(--dg-hairline)" stroke-width="1.2" stroke-linecap="round" vector-effect="non-scaling-stroke" /><g transform="translate(50,203) rotate(-90)"><text x="0" y="0" fill="var(--dg-muted)" font-size="11" font-family="'Onest Variable', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">translation error  (cm)</text></g><rect x="152.46" y="131.24" width="130.08" height="174.76" rx="3" fill="var(--dg-accent)" stroke="none" stroke-width="1.5" vector-effect="non-scaling-stroke" /><rect x="423.46" y="248.21" width="130.08" height="57.79" rx="3" fill="var(--dg-accent)" stroke="none" stroke-width="1.5" vector-effect="non-scaling-stroke" />
