<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" id="dg-pnp-correspondences" role="img" aria-labelledby="dg-pnp-correspondences-t dg-pnp-correspondences-d">
<title id="dg-pnp-correspondences-t">What a PnP solver is given: four known 3D points and their observed 2D positions</title>
<desc id="dg-pnp-correspondences-d">Two panels. On the left, a square marker lying on a ground plane with its four corners numbered, and a camera drawn as a view frustum with a sight line running from its centre through each corner. On the right, the image that camera records: the same four corners as 2D points, numbered to match. Each numbered pair is one correspondence. The marker's corner positions are known by design and the image positions are measured by the detector; the camera's position and orientation are the unknowns the solver recovers from those four pairs.</desc>
<style>#dg-pnp-correspondences{--dg-ink:#0a0a0a;--dg-muted:rgba(10,10,10,0.62);--dg-faint:rgba(10,10,10,0.48);--dg-hairline:rgba(10,10,10,0.14);--dg-grid:rgba(10,10,10,0.07);--dg-surface:rgba(10,10,10,0.04);--dg-surface-strong:rgba(10,10,10,0.08);--dg-paper:#ffffff;--dg-accent:#5b5aa8;--dg-accent-soft:rgba(120,119,198,0.16);--dg-accent2:#00734d;--dg-accent2-soft:rgba(0,224,143,0.16);--dg-warn:#a54a08;--dg-warn-soft:rgba(180,83,9,0.14);max-width:100%;height:auto;display:block}[data-theme="dark"] #dg-pnp-correspondences{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #dg-pnp-correspondences{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}}#dg-pnp-correspondences text{font-variant-numeric:tabular-nums;white-space:pre}</style>
