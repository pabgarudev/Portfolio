<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" id="dg-thesis-branches" role="img" aria-labelledby="dg-thesis-branches-t dg-thesis-branches-d">
<title id="dg-thesis-branches-t">Four years at the University of Cordoba: three thesis ideas and what grew from them</title>
<desc id="dg-thesis-branches-d">A timeline from 2021 to 2025. Three overlapping research tracks run left to right: Fiducial Objects from 2021, Large-Scale Indoor Camera Positioning from 2022, and Sparse Camera Positioning from 2023, which continues directly from the large-scale work. Two offshoots branch off the Fiducial Objects track in 2023: Markie, a vision-based input device, and a teaching workshop on fiducial markers. Three milestones are marked along the axis: joining on a seed grant in early 2021, becoming a Research Engineer in mid-2022, and defending the Ph.D. Cum Laude in 2025. The tracks overlap rather than running in sequence.</desc>
