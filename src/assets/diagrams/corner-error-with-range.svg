<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" id="dg-corner-error-with-range" role="img" aria-labelledby="dg-corner-error-with-range-t dg-corner-error-with-range-d">
<title id="dg-corner-error-with-range-t">One pixel of corner error costs far more range than it does lateral position</title>
<desc id="dg-corner-error-with-range-d">A chart of the real-world position error produced by a single pixel of corner-detection error, against the distance from camera to marker, for a 10 centimetre marker and a 1000 pixel focal length. Lateral error grows linearly and reaches about 5 millimetres at 5 metres. Range error, inferred from the marker's apparent size, grows quadratically and reaches about 250 millimetres at the same distance -- roughly fifty times worse. The gap widens continuously with distance.</desc>
<style>#dg-corner-error-with-range{--dg-ink:#0a0a0a;--dg-muted:rgba(10,10,10,0.62);--dg-faint:rgba(10,10,10,0.48);--dg-hairline:rgba(10,10,10,0.14);--dg-grid:rgba(10,10,10,0.07);--dg-surface:rgba(10,10,10,0.04);--dg-surface-strong:rgba(10,10,10,0.08);--dg-paper:#ffffff;--dg-accent:#5b5aa8;--dg-accent-soft:rgba(120,119,198,0.16);--dg-accent2:#00734d;--dg-accent2-soft:rgba(0,224,143,0.16);--dg-warn:#a54a08;--dg-warn-soft:rgba(180,83,9,0.14);max-width:100%;height:auto;display:block}[data-theme="dark"] #dg-corner-error-with-range{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #dg-corner-error-with-range{--dg-ink:#ffffff;--dg-muted:rgba(255,255,255,0.62);--dg-faint:rgba(255,255,255,0.40);--dg-hairline:rgba(255,255,255,0.14);--dg-grid:rgba(255,255,255,0.07);--dg-surface:rgba(255,255,255,0.05);--dg-surface-strong:rgba(255,255,255,0.10);--dg-paper:#0a0a0a;--dg-accent:#a5a4e0;--dg-accent-soft:rgba(120,119,198,0.22);--dg-accent2:#00e08f;--dg-accent2-soft:rgba(0,224,143,0.18);--dg-warn:#fbbf24;--dg-warn-soft:rgba(251,191,36,0.16);}}#dg-corner-error-with-range text{font-variant-numeric:tabular-nums;white-space:pre}</style>
